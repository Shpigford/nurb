[project]
name = "nurb-evals"
version = "0.1.0"
description = "The nurb LLM benchmark: score models designing 3D-printable parts"
requires-python = ">=3.13"
# shapely/networkx/rtree are trimesh's optional path-handling stack, used by the
# function tasks' retention checks (mesh cross-sections to 2D polygons).
dependencies = ["nurb", "shapely>=2", "networkx>=3", "rtree>=1"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8.0",
]

[tool.uv.sources]
nurb = { path = "..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nurb_evals"]
