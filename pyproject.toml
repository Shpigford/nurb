[project]
name = "nurb"
version = "0.1.0"
description = "Agentic CAD for 3D printing"
readme = "README.md"
authors = [
    { name = "Josh Pigford", email = "josh@joshpigford.com" }
]
requires-python = ">=3.13"
license = "LicenseRef-FSL-1.1-MIT"
license-files = ["LICENSE"]
keywords = ["cad", "3d-printing", "parametric", "build123d", "occt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "build123d>=0.11.1",
    "trimesh>=4.12.2",
    "watchdog>=6.0.0",
    "websockets>=16.1.1",
]

[project.optional-dependencies]
# `nurb render` screenshots the viewer, which means a browser. Optional because it is
# the only command that needs one and the download is larger than everything else here.
render = ["playwright>=1.49"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
nurb = "nurb.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = [
    "src/nurb/viewer.html",
    "src/nurb/doctrine.md",
    "src/nurb/agents.md",
    "src/nurb/printers.toml",
    "src/nurb/vendor/**/*",
]
