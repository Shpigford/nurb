[package]
# The binary name is what macOS shows for dev runs (menu bar, Dock, AX), so
# it matches the productName rather than the scaffold's "desktop".
name = "nurb"
version = "0.1.0"
description = "The nurb desktop app"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nurb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
agent-client-protocol = "2.0.0"
tokio = { version = "1", features = ["rt", "process", "io-util", "sync", "macros", "time"] }
async-process = "2"
futures-lite = "2"
sha2 = "0.10"
# Part deletion goes through the Trash, never rm: it is the one place the app
# destroys user work, so it has to be recoverable.
trash = "5"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The Gemini API key's home: macOS talks to /usr/bin/security directly, but
# Windows Credential Manager has no such CLI, and hand-rolled CredWrite FFI
# would re-earn this crate's UTF-16 and blob handling one bug at a time.
keyring = { version = "3", features = ["windows-native"] }

