<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nurb</title>
<style>
  :root {
    --bg: #16181d; --panel: #1d2027; --line: #2b2f38;
    --text: #e6e8ec; --dim: #868d9b; --accent: #6ee7a8; --bad: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--bg); color: var(--text);
    height: 100vh; display: grid; grid-template-columns: 220px 1fr; overflow: hidden;
    /* `minmax(0, 1fr)` and not `1fr`. An implicit row is auto-sized, so it grows to its
       tallest content and the sidebar reaches whatever height thirteen sliders want.
       `overflow: hidden` then clips it and there is nothing to scroll, because the
       panel inside was never made smaller than the viewport in the first place. */
    grid-template-rows: minmax(0, 1fr);
  }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  aside h1 { font-size: 13px; font-weight: 600; padding: 14px 16px;
             border-bottom: 1px solid var(--line); letter-spacing: .08em;
             display: flex; align-items: baseline; gap: 7px; }
  aside h1 span { color: var(--dim); font-weight: 400; letter-spacing: 0; }
  /* The project is the thing you are working in, so it reads as text rather than as
     chrome. Two `nurb dev` on two directories look identical without it. */
  aside h1 #project { color: var(--text); overflow: hidden; text-overflow: ellipsis;
                      white-space: nowrap; }
  aside h1 svg { width: 13px; height: 13px; color: var(--accent); align-self: center; flex: none; }
  /* Amber while connecting or reconnecting, gone once the socket is up. */
  aside h1 #conn { margin-left: auto; flex: none; font-size: 10px; color: #f0c274; }
  aside h1 #conn:empty { display: none; }
  /* The list gives way to the parameters: three parts and fifteen sliders is the
     common case, not the other way round.

     `min-height: 0` on both is what makes either of them scroll at all. A column flex
     item defaults to `min-height: auto`, which refuses to shrink below its content, so
     `overflow-y` never has anything to do and the panel just runs off the bottom of the
     viewport. It looks like a missing scrollbar and it is a sizing bug. */
  #list { flex: 0 1 auto; min-height: 0; max-height: 38%; overflow-y: auto; padding: 6px; }
  .item { padding: 8px 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .item:hover { background: #23272f; }
  .item.active { background: #2c313b; }
  .item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .ms { color: var(--dim); font-size: 11px; }
  /* A variant is its part flexed, so it nests under it: indented past the dot, dim
     until it is the configuration on screen. */
  .item.var { padding: 4px 10px 4px 24px; font-size: 12px; }
  .item.var .name { color: var(--dim); }
  .item.var.active .name { color: var(--text); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
  .dot.bad { background: var(--bad); }
  .dot.busy { animation: pulse .6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  main { position: relative; overflow: hidden; }
  /* Absolute + 100% keeps layout size independent of the drawing-buffer size.
     Without this, setSize() changes the canvas's layout box, which re-fires the
     ResizeObserver, which calls setSize() again -- a resize loop that flickers. */
  canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
  /* The canvas is appended last, so overlays need to be lifted above it. */
  #hud, #err, #tools, #empty, #checks { z-index: 1; }
  #hud {
    position: absolute; left: 16px; bottom: 14px; color: var(--dim);
    font-size: 11px; pointer-events: none; line-height: 1.7;
    text-shadow: 0 1px 2px rgba(0,0,0,.5);
  }
  #hud b { color: var(--text); font-weight: 600; }
  #err {
    position: absolute; inset: auto 16px 14px 16px; max-height: 42%; overflow: auto;
    background: rgba(42,22,24,.94); border: 1px solid #5b2b2f; color: #ffb4b4;
    padding: 12px 14px; border-radius: 10px; white-space: pre-wrap;
    font-size: 11px; display: none;
    box-shadow: 0 4px 16px rgba(0,0,0,.35); backdrop-filter: blur(10px);
  }
  #tools {
    position: absolute; top: 14px; right: 14px;
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
  }
  button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    padding: 7px 12px; border-radius: 7px; cursor: pointer; font: inherit; font-size: 11px;
  }
  button:hover { border-color: var(--dim); }
  button:focus-visible { outline: none; border-color: var(--accent); }
  button svg, a svg { width: 12px; height: 12px; flex: none; }
  /* One pill: borderless icon buttons on a translucent bar, dividers between groups.
     The pill carries the border and the shadow, so the toolbar reads as a single piece
     of chrome floating above the geometry rather than four stray buttons. */
  .pill {
    display: flex; align-items: center; gap: 2px; padding: 3px;
    background: rgba(29,32,39,.9); border: 1px solid var(--line); border-radius: 9px;
    box-shadow: 0 4px 16px rgba(0,0,0,.35); backdrop-filter: blur(10px);
  }
  .pill .sep { width: 1px; height: 16px; background: var(--line); margin: 0 3px; flex: none; }
  .pill button {
    display: inline-flex; align-items: center; gap: 6px;
    background: none; border: none; padding: 5px 9px; border-radius: 6px; color: var(--text);
  }
  .pill button:hover { background: #262b34; }
  .pill button:focus-visible { box-shadow: 0 0 0 1px var(--accent) inset; }
  .pill button svg { color: var(--dim); }
  .pill button:hover svg { color: var(--text); }
  .pill button.on { color: var(--accent); background: rgba(110,231,168,.1); }
  .pill button.on svg { color: var(--accent); }
  #download { display: contents; }
  #download button:disabled { color: var(--dim); cursor: default; }
  #reframe { display: none; align-items: center; gap: 6px;
             background: rgba(29,32,39,.9); box-shadow: 0 4px 16px rgba(0,0,0,.35);
             backdrop-filter: blur(10px); }
  #reframe svg { color: var(--dim); }
  #cut { display: none; align-items: center; }
  #cut.open { display: flex; }
  #cut button { padding: 4px 9px; color: var(--dim); }
  #cut button.on { color: var(--accent); background: rgba(110,231,168,.1); }
  #cut input { width: 110px; margin: 0 6px 0 4px; }
  #empty { position: absolute; inset: 0; display: grid; place-items: center;
           color: var(--dim); text-align: center; }
  #empty svg { width: 44px; height: 44px; opacity: .45; margin-bottom: 10px; }
  #empty code {
    display: inline-block; margin-top: 8px; padding: 4px 10px; font: inherit;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    color: var(--text);
  }
  #checks {
    position: absolute; top: 14px; left: 16px; max-width: 46%; max-height: 60%;
    overflow: auto; display: none; font-size: 11px; line-height: 1.6;
    background: rgba(29,32,39,.9); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,.35); backdrop-filter: blur(10px);
  }
  #checks h2 { display: flex; align-items: center; gap: 6px; font-size: 11px;
               font-weight: 600; color: var(--dim); margin-bottom: 5px; letter-spacing: .04em; }
  #checks h2 .n { background: #262b34; border-radius: 8px; padding: 0 7px; }
  #checks .f { display: flex; gap: 7px; padding: 2px 0; cursor: default; }
  #checks .f:hover { color: #fff; }
  #checks .ic { flex: none; width: 12px; height: 12px; margin-top: 2.5px; }
  #checks .fail .ic { color: var(--bad); }
  #checks .warn .ic { color: #f0c274; }
  /* Wide enough for the longest rule name. At 92px `projection_ratio` overflowed its
     column and printed on top of its own message. */
  #checks .rule { flex: none; color: var(--dim); width: 118px; }
  #checks .ok { color: var(--accent); display: flex; align-items: center; gap: 7px; }
  /* What a slider makes stale is the numbers, not the shape: the bbox, the build time
     and the findings all describe the solid that is being replaced. The mesh is left
     alone because fading it already means "this build failed". The .25s delay is the
     point: anything that lands inside one round trip never dims at all, so the hook
     shows no state change and the shelf does. */
  #hud, #checks { transition: opacity .12s .25s; }
  body.stale #hud, body.stale #checks { opacity: .32; }

  #foot { margin-top: auto; padding: 9px 12px; border-top: 1px solid var(--line);
          display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px;
          color: var(--dim); font-size: 10px; }
  #version { white-space: nowrap; }
  /* The badge stays the size of the version number when an update exists: growing it
     to "v0.2.0 -> 0.3.0" rewrapped the footer and shoved the links down a line. The
     detail lives in the modal instead. */
  #version.update { color: var(--accent); cursor: pointer; }
  #version.update:hover { text-decoration: underline; }
  #upgrade { position: fixed; inset: 0; z-index: 2; display: none;
             place-items: center; background: rgba(0,0,0,.45); }
  #upgrade.open { display: grid; }
  #upgrade .card { background: var(--panel); border: 1px solid var(--line);
                   border-radius: 10px; padding: 16px 18px; width: 320px;
                   font-size: 12px; line-height: 1.7;
                   box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  #upgrade .card b { color: var(--accent); font-weight: 600; }
  #upgrade code { display: block; background: var(--bg); border: 1px solid var(--line);
                  border-radius: 6px; padding: 6px 10px; margin: 10px 0;
                  user-select: all; -webkit-user-select: all; }
  #upgrade button { width: 100%; }
  #upgrade .note { color: var(--dim); margin-top: 8px; white-space: pre-wrap; }
  #upgrade .note.bad { color: var(--bad); }
  #links { margin-left: auto; display: flex; gap: 10px; }
  #foot a { color: var(--dim); text-decoration: none; }
  #foot a:hover { color: var(--text); }

  /* ---- parameters ---- */
  #params { flex: 1 1 auto; min-height: 0; overflow-y: auto; border-top: 1px solid var(--line); padding: 0 12px 12px; }
  #params.empty { display: none; }
  #params h2 {
    position: sticky; top: 0; background: var(--panel); z-index: 1;
    display: flex; align-items: center; padding: 10px 0 6px;
    font-size: 11px; font-weight: 600; color: var(--dim); letter-spacing: .04em;
  }
  #params h2 a { margin-left: auto; color: var(--dim); cursor: pointer; text-decoration: none;
                 display: none; align-items: center; gap: 4px; }
  #params h2 a svg { width: 11px; height: 11px; }
  #params h2 a:hover { color: var(--text); }
  body.dirty #params h2 a { display: flex; }
  /* Parameters the rest of the project shares, folded away. They are adjustable, and
     adjusting one is a different act from adjusting a dimension: it makes this part
     disagree with its siblings rather than changing its shape. Collapsed by default,
     and the summary lights up if anything inside it has been moved, so a family
     constant cannot be left changed out of sight. */
  #family { border-top: 1px dashed var(--line); margin-top: 6px; }
  #family summary {
    cursor: pointer; color: var(--dim); font-size: 11px; padding: 9px 0 5px;
    list-style: none; letter-spacing: .04em;
  }
  #family summary::-webkit-details-marker { display: none; }
  #family summary::before { content: '\25b8  '; }
  #family[open] summary::before { content: '\25be  '; }
  #family summary:hover { color: var(--text); }
  #family:has(.p.dirty) summary { color: var(--accent); }
  .p { padding: 5px 0 7px 7px; border-left: 2px solid transparent; }
  .p.dirty { border-left-color: var(--accent); }
  .p .top { display: flex; align-items: center; }
  .p .k { color: var(--dim); font-size: 11px; cursor: default;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .p.dirty .k { color: var(--text); }
  .p .v {
    width: 58px; margin-left: auto; text-align: right; background: none; border: none;
    color: var(--text); font: inherit; font-size: 11px; border-radius: 3px; padding: 1px 3px;
  }
  .p .v::-webkit-outer-spin-button, .p .v::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .p .v { -moz-appearance: textfield; }
  .p .v:hover { background: #23272f; }
  .p .v:focus { outline: none; background: #23272f; box-shadow: 0 0 0 1px var(--accent); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 10px; background: none; }
  .p input[type=range] { margin-top: 4px; }
  input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--line); border-radius: 1px; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 9px; height: 9px; margin-top: -3.5px;
    border-radius: 50%; background: var(--dim); transition: background .1s;
  }
  input[type=range]::-moz-range-track { height: 2px; background: var(--line); border-radius: 1px; }
  input[type=range]::-moz-range-thumb { width: 9px; height: 9px; border: none; border-radius: 50%; background: var(--dim); }
  .p:hover input[type=range]::-webkit-slider-thumb,
  .p.dirty input[type=range]::-webkit-slider-thumb { background: var(--accent); }
  .p:hover input[type=range]::-moz-range-thumb,
  .p.dirty input[type=range]::-moz-range-thumb { background: var(--accent); }
  input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px rgba(110,231,168,.25); }
  input[type=range]:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 3px rgba(110,231,168,.25); }
  #write { display: none; width: 100%; margin-top: 10px; text-align: left; line-height: 1.4; }
  body.dirty #write { display: block; }
  #note { font-size: 11px; color: var(--dim); margin-top: 8px; white-space: pre-wrap; }
  #note.bad { color: var(--bad); }
  /* ?bare hides the chrome so a render is geometry on the plate and nothing else.
     Findings and sizes are text, and the CLI already prints them better than a PNG. */
  body.bare { grid-template-columns: 1fr; }
  body.bare aside, body.bare #hud, body.bare #checks, body.bare #tools { display: none; }
  /* Nothing to reframe or cut through yet, and this is the first screen a new project
     shows. */
  body.noparts #tools { display: none; }
</style>
</head>

<script type="importmap">
{ "imports": {
  "three": "/vendor/three/build/three.module.min.js",
  "three/addons/": "/vendor/three/addons/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const parts = new Map();
let current = null, mesh = null, lastSize = null;

// A headless render drives this same page, so the scene an agent sees is the scene a
// human sees. ?view= also means "frame it deterministically", ignoring the saved camera.
const q = new URLSearchParams(location.search);
const want = q.get('part'), view = q.get('view'), bare = q.has('bare');
let wantVariant = q.get('variant');   // consumed by the first sync, then the URL just mirrors
const VIEWS = {
  iso: [0.7, -0.75, 0.6], front: [0, -1, 0], back: [0, 1, 0],
  left: [-1, 0, 0], right: [1, 0, 0], top: [0, 0, 1],
};
if (bare) document.body.classList.add('bare');

// ---- scene (Z-up, matching CAD) ----
const main = document.querySelector('main');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x16181d);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 10000);
camera.up.set(0, 0, 1);

// stencil: the section view caps its cut with a stencil pass, and the buffer is off
// by default. Without it the cap silently never draws.
const renderer = new THREE.WebGLRenderer({ antialias: true, stencil: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.localClippingEnabled = true;
main.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.12;

// Declared up here rather than next to the code that uses it, because `show` writes
// `ready` and a headless render polls it. Both happen after this module is evaluated, so
// the old position worked, but only by luck of ordering.
window.__nurb = { THREE, scene, camera, controls, ready: false, get mesh() { return mesh; } };

scene.add(new THREE.HemisphereLight(0xffffff, 0x404050, 2.2));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(1, -1.4, 2);
scene.add(key);

const grid = new THREE.GridHelper(400, 40, 0x3a3f4a, 0x24272e);
grid.rotation.x = Math.PI / 2;   // GridHelper is XZ; we want XY
scene.add(grid);

// Findings get a pin at their reported point, in the same shifted space as the mesh.
const pins = new THREE.Group();
scene.add(pins);
const pinGeom = new THREE.SphereGeometry(1, 12, 8);
// Pins draw through the solid, on purpose. A rule reports a point on a face, so the pin
// sits half inside the material and the part hides it from most angles: the `fail` pin on
// a shelf underside is invisible from every view that shows the shelf. A marker you cannot
// see is worse than none, because the panel still says it is there. renderOrder as well as
// depthTest, since the mesh is added to the scene after this group and would otherwise
// paint over it.
const pinMat = {
  fail: new THREE.MeshBasicMaterial({ color: 0xf87171, depthTest: false, depthWrite: false }),
  warn: new THREE.MeshBasicMaterial({ color: 0xf0c274, depthTest: false, depthWrite: false }),
};

const material = new THREE.MeshStandardMaterial({
  color: 0x9aa6b8, metalness: 0.05, roughness: 0.62, flatShading: false,
});

let lastW = 0, lastH = 0;
function resize() {
  const w = main.clientWidth, h = main.clientHeight;
  if (!w || !h || (w === lastW && h === lastH)) return;   // belt and braces
  lastW = w; lastH = h;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(main);
resize();

(function tick() {
  requestAnimationFrame(tick);
  controls.update();
  renderer.render(scene, camera);
})();

// ---- section ----
// A plain clip renders a solid as a shell: the near wall is cut away and the far wall is
// backface-culled, so a box comes out as two floating panels. DoubleSide fixes the hole
// but makes a solid look exactly like a hollow one, which is the single thing a
// printability viewer must not do. So: a stencil pass marks where the plane passes
// through material, and a cap is painted only there.
//
// The plane lives on the materials that should be cut, never on renderer.clippingPlanes.
// A global plane is merged into every material including ones that set none, which would
// clip the finding pins away at exactly the moment they matter, and would z-fight the cap
// against itself.
const AXES = { x: [1, 0, 0], y: [0, 1, 0], z: [0, 0, 1] };
const PARKED = 1e6;   // "off", without changing the array length and recompiling shaders
const plane = new THREE.Plane(new THREE.Vector3(0, 0, -1), PARKED);
let cutAxis = 'z', cutAt = 0.5, cutting = false, writers = [];

const stencilBase = {
  depthWrite: false, depthTest: false, colorWrite: false,
  stencilWrite: true, stencilFunc: THREE.AlwaysStencilFunc, clippingPlanes: [plane],
};
const stencilBack = new THREE.MeshBasicMaterial({
  ...stencilBase, side: THREE.BackSide,
  stencilFail: THREE.IncrementWrapStencilOp,
  stencilZFail: THREE.IncrementWrapStencilOp,
  stencilZPass: THREE.IncrementWrapStencilOp,
});
const stencilFront = new THREE.MeshBasicMaterial({
  ...stencilBase, side: THREE.FrontSide,
  stencilFail: THREE.DecrementWrapStencilOp,
  stencilZFail: THREE.DecrementWrapStencilOp,
  stencilZPass: THREE.DecrementWrapStencilOp,
});
const cap = new THREE.Mesh(
  new THREE.PlaneGeometry(1, 1),
  new THREE.MeshStandardMaterial({
    color: 0xc9a227, metalness: 0.0, roughness: 0.85, side: THREE.DoubleSide,
    stencilWrite: true, stencilRef: 0, stencilFunc: THREE.NotEqualStencilFunc,
    stencilFail: THREE.ReplaceStencilOp,
    stencilZFail: THREE.ReplaceStencilOp,
    stencilZPass: THREE.ReplaceStencilOp,
  })
);
cap.renderOrder = 1.1;
cap.visible = false;
cap.onAfterRender = r => r.clearStencil();
scene.add(cap);

function sectionAttach() {
  for (const w of writers) scene.remove(w);
  writers = [];
  if (!mesh) return;
  for (const mat of [stencilBack, stencilFront]) {
    const w = new THREE.Mesh(mesh.geometry, mat);
    w.position.copy(mesh.position);
    w.renderOrder = 1;
    scene.add(w);
    writers.push(w);
  }
  sectionUpdate();
}

function sectionUpdate() {
  const on = cutting && !!mesh;
  cap.visible = on;
  for (const w of writers) w.visible = on;
  if (!on) { plane.constant = PARKED; return; }
  const box = mesh.geometry.boundingBox.clone().translate(mesh.position);
  const lo = box.min[cutAxis], hi = box.max[cutAxis];
  // A hair inside the bounds at each end, so neither extreme is a cut through nothing.
  const at = lo + (hi - lo) * (0.02 + 0.96 * cutAt);
  const dir = AXES[cutAxis];
  plane.normal.set(-dir[0], -dir[1], -dir[2]);   // keeps the side the normal points at
  plane.constant = at;
  const span = box.getSize(new THREE.Vector3()).length();
  cap.scale.set(span, span, 1);
  // Centred on the part, not on coplanarPoint, which is where the plane passes the
  // world origin. A part's own origin is a modeling datum: the shelf lives entirely at
  // x <= 0, so an origin-centred cap left the far 49mm of its cut face bare and spent
  // half its area on empty space.
  plane.projectPoint(box.getCenter(new THREE.Vector3()), cap.position);
  cap.lookAt(cap.position.x - plane.normal.x, cap.position.y - plane.normal.y,
             cap.position.z - plane.normal.z);
}

// ---- download ----
// This is the configurator. The sliders already hold an exploration, so the file
// that comes back is the polished build of exactly what is on screen, whatever the
// preview economy: draft is for the loop, a download is on its way to a slicer.
// Fetched rather than navigated, so a failed build lands in the note instead of
// replacing the viewer with a traceback.
for (const b of document.querySelectorAll('#download button')) {
  b.onclick = async () => {
    if (!current) return;
    // The label lives in a span so swapping it leaves the icon alone.
    const fmt = b.dataset.fmt, lab = b.querySelector('span'), was = lab.textContent;
    b.disabled = true; lab.textContent = 'building';
    try {
      const r = await fetch(`/export/${current}.${fmt}`);
      if (!r.ok) throw new Error(await r.text());
      const url = URL.createObjectURL(await r.blob());
      // A variant is a catalog entry, so its file carries the catalog name: sliders
      // sitting on hook_utility download hook_utility.stl, not hook_scissors.stl.
      const v = activeVariant(parts.get(current));
      const a = Object.assign(document.createElement('a'),
                              { href: url, download: `${v ? v.name : current}.${fmt}` });
      a.click();
      URL.revokeObjectURL(url);
    } catch (e) {
      const note = document.getElementById('note');
      if (note) { note.classList.add('bad'); note.textContent = `export failed: ${e.message}`; }
    } finally {
      b.disabled = false; lab.textContent = was;
    }
  };
}

// On by default, matching the server: draft is a preview economy, and what the user
// judges on screen should be the part that exports. Every rebuild while it is off is
// a draft, so flipping it rebuilds the project in the new mode.
let polished = true;
function polishBadge() {
  document.getElementById('polishbtn').classList.toggle('on', polished);
}
polishBadge();
document.getElementById('polishbtn').onclick = () => {
  if (!sock || sock.readyState !== WebSocket.OPEN) return;
  polished = !polished;
  polishBadge();
  sock.send(JSON.stringify({ type: 'draft', on: !polished }));
};

document.getElementById('sectionbtn').onclick = ev => {
  cutting = !cutting;
  ev.currentTarget.classList.toggle('on', cutting);
  document.getElementById('cut').classList.toggle('open', cutting);
  sectionUpdate();
};
document.getElementById('cutpos').oninput = ev => { cutAt = +ev.target.value; sectionUpdate(); };
for (const b of document.querySelectorAll('#cut button')) {
  b.classList.toggle('on', b.dataset.axis === cutAxis);
  b.onclick = () => {
    cutAxis = b.dataset.axis;
    for (const o of document.querySelectorAll('#cut button')) o.classList.toggle('on', o === b);
    sectionUpdate();
  };
}

// ---- camera persistence ----
// A rebuild is a geometry swap, never a camera reset. Reloads restore per part.
const camKey = n => `nurb.cam.v2.${n}`;  // v2: parts now sit on the plate, not under it
let saveTimer = null;
controls.addEventListener('change', () => {
  if (!current) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    localStorage.setItem(camKey(current), JSON.stringify({
      p: camera.position.toArray(), t: controls.target.toArray(),
    }));
  }, 250);
});

function restoreCamera(name) {
  try {
    const s = JSON.parse(localStorage.getItem(camKey(name)));
    if (!s) return false;
    camera.position.fromArray(s.p);
    controls.target.fromArray(s.t);
    controls.update();
    return true;
  } catch { return false; }
}

function frame(box, from) {
  const size = box.getSize(new THREE.Vector3());
  const mid = box.getCenter(new THREE.Vector3());
  const span = Math.max(size.x, size.y, size.z) || 10;
  // A named view is only ever asked for by a still, and a still does not need the
  // headroom that orbiting comfortably does, so it gets a tighter fit.
  const pad = from ? 1.45 : 2.1;
  const dist = span / (2 * Math.tan((camera.fov * Math.PI / 180) / 2)) * pad;
  const dir = VIEWS[from] || VIEWS.iso;
  // Straight down is degenerate in a Z-up scene: the view direction is parallel to the
  // camera's up vector, and the orientation comes out undefined rather than wrong.
  camera.up.set(0, 0, 1);
  if (!dir[0] && !dir[1]) camera.up.set(0, 1, 0);
  camera.position.set(mid.x + dist * dir[0], mid.y + dist * dir[1], mid.z + dist * dir[2]);
  controls.target.copy(mid);
  camera.near = span / 100; camera.far = span * 100;
  camera.updateProjectionMatrix();
  controls.update();
}

// ---- loading ----
const loader = new GLTFLoader();

// `ready` is what a headless render waits on. Two frames after the geometry lands,
// because one only guarantees the mesh is in the scene, not that it has been painted.
// Set on every exit path including a failed build, or a render of a broken part hangs.
async function show(name, opts) {
  window.__nurb.ready = false;
  try {
    await paint(name, opts);
  } finally {
    requestAnimationFrame(() => requestAnimationFrame(() => { window.__nurb.ready = true; }));
  }
}

async function paint(name, { keepCamera }) {
  const entry = parts.get(name);
  const err = document.getElementById('err');
  document.getElementById('empty').style.display = 'none';

  if (entry.error) {
    err.style.display = 'block';
    err.textContent = entry.traceback || entry.error;
    if (mesh) {                              // last good geometry stays, visibly stale
      mesh.material.transparent = true;
      mesh.material.opacity = 0.22;
      mesh.material.needsUpdate = true;
    }
    hud(entry);
    checks(name);
    params(entry);
    return;
  }
  err.style.display = 'none';

  const gltf = await loader.loadAsync(`/glb/${name}.glb?v=${entry.token}`);
  const geo = [];
  gltf.scene.traverse(o => { if (o.isMesh) geo.push(o.geometry); });
  if (!geo.length) return;

  if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); }
  if (!geo[0].attributes.normal) geo[0].computeVertexNormals();  // never render unlit
  mesh = new THREE.Mesh(geo[0], material.clone());
  mesh.material.clippingPlanes = [plane];   // parked unless the section view is on
  scene.add(mesh);

  mesh.geometry.computeBoundingBox();
  // The grid is the build plate, so a part sits on it. Where a part's own origin
  // falls is a modeling datum and nothing to do with printing: Notch hangs
  // everything below z=0, which would put every part underneath the plate.
  mesh.position.z = -mesh.geometry.boundingBox.min.z;
  const box = mesh.geometry.boundingBox.clone().translate(mesh.position);
  const size = box.getSize(new THREE.Vector3()).length();
  sectionAttach();

  // Only reframe when the part changed scale enough that the camera is lost.
  const jumped = lastSize && (size / lastSize > 3 || lastSize / size > 3);
  const reframe = document.getElementById('reframe');
  if (view) {
    frame(box, view);                       // asked for a named view: no saved camera
    reframe.style.display = 'none';
  } else if (!keepCamera) {
    if (!restoreCamera(name)) frame(box);
    reframe.style.display = 'none';
  } else {
    reframe.style.display = jumped ? 'inline-flex' : 'none';
  }
  reframe.onclick = () => { frame(box); reframe.style.display = 'none'; };
  lastSize = size;
  hud(parts.get(name) || entry);
  checks(name);
  params(parts.get(name) || entry);
}

// Takes a name, not an entry. `show` awaits the GLB fetch, so an entry captured
// before that await is stale by the time it resolves: the checks message has already
// landed and repainted, and the old entry then hides the panel it just filled in.
function checks(name) {
  const e = parts.get(name);
  const box = document.getElementById('checks');
  pins.clear();
  const found = e && e.findings;
  if (!e || e.error || found === null || found === undefined) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  if (!found.length) {
    box.innerHTML = '<h2>checks</h2><div class="ok"><svg class="ic"><use href="#i-ok"/></svg>clean</div>';
    return;
  }
  // The icon is the severity tag: shape and color both carry it, the title spells it out.
  const rows = found.map(f =>
    `<div class="f ${f.severity}" title="${f.severity}">`
    + `<svg class="ic"><use href="#i-${f.severity === 'fail' ? 'fail' : 'warn'}"/></svg>`
    + `<span class="rule">${f.rule}</span><span>${f.message}</span></div>`).join('');
  box.innerHTML = `<h2>checks <span class="n">${found.length}</span></h2>${rows}`;
  const lift = mesh ? mesh.position.z : 0;
  for (const f of found) {
    if (!f.where) continue;
    const pin = new THREE.Mesh(pinGeom, pinMat[f.severity] || pinMat.warn);
    pin.position.set(f.where[0], f.where[1], f.where[2] + lift);
    pin.scale.setScalar(Math.max(0.6, lastSize ? lastSize / 90 : 1));
    pin.renderOrder = 999;  // per mesh, not on the group: a Group's renderOrder only
                            // reaches its children in some three.js versions
    pins.add(pin);
  }
}

function hud(e) {
  document.getElementById('hud').innerHTML = e.error
    ? `<b>${e.name}</b><br>build failed`
    : `<b>${e.name}</b><br>${e.bbox.join(' &times; ')} mm<br>${e.ms} ms`;
}

// ---- parameters ----
// The keyword defaults are the parameters, so the panel is derived from the same
// signature the agent and the CLI read. Nothing here is declared anywhere.

// No part annotates a range, so one has to be guessed, and the guess that survives
// contact with real parts is half the default to double it. A 0-based range puts
// item_depth=0 and chamfer_size=0 one drag away, and both of those are errors rather
// than designs. The range is soft: typing a number outside it widens it.
//
// The type of the default is the annotation. An int default is a count and steps by
// one; a float default is a continuous millimetre. That is why the examples write
// chamfer_size=1.0 and bracket_count=4.
//
// `int` has to be told, never inferred: JavaScript has one number type, so Python's
// 1.0 arrives as 1 and Number.isInteger says true. Only the build knows which it was,
// which is what `kind` in the payload is for.
function infer(d, int) {
  let lo, hi;
  if (d === 0) { lo = 0; hi = int ? 8 : 1; }
  else if (d < 0) { lo = d * 2; hi = d / 2; }
  else { lo = d / 2; hi = d * 2; }
  if (int) {
    lo = Math.floor(lo); hi = Math.ceil(hi);
    if (d >= 1) lo = Math.max(1, lo);
    if (hi - lo < 4) hi = lo + 4;            // never a slider with two stops on it
    return { lo, hi, step: 1, int: true };
  }
  const step = 10 ** (Math.floor(Math.log10(hi - lo)) - 1);
  return { lo: Math.floor(lo / step) * step, hi: Math.ceil(hi / step) * step, step, int: false };
}

const tidy = (v, step) => {
  const places = Math.max(0, -Math.floor(Math.log10(step)));
  return +v.toFixed(places);
};

const values = new Map();     // name -> what the sliders say, for the current part
const defaults = new Map();
const setters = new Map();    // name -> the one function that moves a row's controls
let panelSig = null;
// Writing to the file changes the defaults, which rebuilds this panel, which would
// throw away the note saying what was written. Held here so it survives that, which
// matters most when the answer was "left side_clearance alone, and here is why".
let lastNote = null;

function adjustable(p) { return p.kind === 'int' || p.kind === 'float'; }

function dirty() {
  const out = {};
  for (const [k, v] of values) if (v !== defaults.get(k)) out[k] = v;
  return out;
}

function markDirty() {
  const changed = Object.keys(dirty());
  document.body.classList.toggle('dirty', changed.length > 0);
  for (const row of document.querySelectorAll('.p')) {
    row.classList.toggle('dirty', changed.includes(row.dataset.name));
  }
  const write = document.getElementById('write');
  if (write && current) {
    write.textContent = `write ${changed.length} default${changed.length === 1 ? '' : 's'} `
      + `to ${current}.py`;
  }
}

function params(e) {
  const box = document.getElementById('params');
  // A failed build reports no parameters, and clearing the panel here would take the
  // sliders away at the one moment they are needed: a value that breaks the build has
  // to be draggable back. The panel is only cleared if it belongs to another part.
  if (e.error && panelSig && panelSig.startsWith(e.name + '|')) return;
  const rows = (e.params || []).filter(adjustable);
  const sig = e.name + '|' + rows.map(p => `${p.name}:${p.default}:${p.family ? 1 : 0}`).join(',');
  if (sig === panelSig) { sync(rows); return; }
  panelSig = sig;

  values.clear(); defaults.clear(); setters.clear();
  box.classList.toggle('empty', !rows.length);
  if (!rows.length) { box.innerHTML = ''; document.body.classList.remove('dirty'); return; }

  box.innerHTML = '<h2>parameters<a id="resetall" title="reset every parameter">'
    + '<svg><use href="#i-reset"/></svg>reset</a></h2>';
  // Split, not filtered: a family constant stays reachable, it just stops competing for
  // attention with the dimensions this part actually owns.
  const shared = rows.filter(p => p.family);
  let fold = null;
  if (shared.length && shared.length < rows.length) {
    fold = document.createElement('details');
    fold.id = 'family';
    fold.innerHTML =
      '<summary title="Same name and default across most of this project&#39;s parts. '
      + 'Changing one here makes this part disagree with its siblings.">'
      + `family (${shared.length})</summary>`;
  }
  for (const p of rows) {
    const r = infer(p.default, p.kind === 'int');
    values.set(p.name, p.value); defaults.set(p.name, p.default);
    const row = document.createElement('div');
    row.className = 'p';
    row.dataset.name = p.name;
    row.innerHTML =
      `<div class="top"><span class="k" title="double-click to reset to ${p.default}">${p.name}</span>`
      + `<input class="v" type="number" step="any"></div>`
      + `<input type="range">`;
    const num = row.querySelector('.v'), slide = row.querySelector('[type=range]');
    slide.min = Math.min(r.lo, p.value); slide.max = Math.max(r.hi, p.value);
    slide.step = r.step; slide.value = p.value;
    slide.title = p.name;
    num.value = p.value;

    // Quantization belongs to the slider alone, so it happens at the slider's events
    // rather than in set(): a drag lands on the step (tidy only cleans up the float
    // artifacts of stepping, 0.30000000000000004 into 0.3), while a typed number
    // arrives exact. The range is a guess and the step is a guess; the number someone
    // typed is neither, so typing 95.5 into an integer-stepped slider means 95.5.
    const set = (v, commit) => {
      if (!Number.isFinite(v)) return;
      values.set(p.name, v);
      num.value = v;
      // A typed value outside the guessed range widens it rather than clamping.
      if (v < +slide.min) slide.min = v;
      if (v > +slide.max) slide.max = v;
      slide.value = v;
      markDirty();
      push(commit);
    };
    setters.set(p.name, set);
    slide.oninput = () => set(tidy(+slide.value, r.step), false);
    slide.onchange = () => set(tidy(+slide.value, r.step), true);
    num.onchange = () => set(+num.value, true);
    row.querySelector('.k').ondblclick = () => set(p.default, true);
    (fold && p.family ? fold : box).appendChild(row);
  }
  if (fold) box.appendChild(fold);
  const write = document.createElement('button');
  write.id = 'write';
  write.title = 'replaces the keyword defaults in the part file';
  write.onclick = () => sock && sock.send(JSON.stringify({ type: 'apply', name: current }));
  box.appendChild(write);
  const note = document.createElement('div');
  note.id = 'note';
  if (lastNote && lastNote.name === e.name) {
    note.textContent = lastNote.text;
    note.classList.toggle('bad', lastNote.bad);
  }
  box.appendChild(note);
  // Through the same setters a drag uses. Rebuilding the panel here instead would read
  // the values back off the entry, which still holds the overrides being discarded, and
  // put every slider straight back where it was.
  document.getElementById('resetall').onclick = () => {
    for (const [name, set] of setters) set(defaults.get(name), false);
    push(true);
  };
  markDirty();
}

// The server's values win, except on a control someone is holding: a rebuild lands
// mid-drag and would otherwise yank the slider out from under the finger.
function sync(rows) {
  for (const p of rows) {
    defaults.set(p.name, p.default);
    const row = document.querySelector(`.p[data-name="${p.name}"]`);
    if (!row) continue;
    const num = row.querySelector('.v'), slide = row.querySelector('[type=range]');
    if (document.activeElement === num || document.activeElement === slide) continue;
    values.set(p.name, p.value);
    num.value = p.value; slide.value = p.value;
  }
  markDirty();
}

// One rebuild in flight, always carrying the newest values. Nothing can queue up,
// because there is only ever one request out, and nothing is lost, because the reply
// checks for input that arrived while it was away. A fixed debounce cannot work here:
// the round trip is 60ms on the hook and 430ms on the shelf, and no constant is right
// for both. This clocks itself off the part being edited.
// Both of these hold a part name rather than a flag. A rebuild can land while the user
// is already looking at something else, and a boolean cannot tell "mine came back" from
// "someone else's did": clicking another part mid-rebuild used to leave the flag stuck
// on forever, which killed every slider in the session.
let pending = null, pendingFor = null, inflight = null, timer = null, sock = null;

function push(commit) {
  lastNote = null;                      // moving a slider answers the last write
  const note = document.getElementById('note');
  if (note) note.textContent = '';
  pending = dirty();
  pendingFor = current;
  clearTimeout(timer);
  if (commit) flush();                  // released the slider, or typed a number
  else timer = setTimeout(flush, 90);   // skip the values a drag passed straight over
}

function flush() {
  if (pending === null || inflight || !sock || sock.readyState !== WebSocket.OPEN) return;
  // Values collected for a part the user has since left. The server still holds that
  // part's overrides, so dropping this loses nothing.
  if (pendingFor !== current) { pending = null; return; }
  const payload = pending;
  pending = null;
  inflight = current;
  document.body.classList.add('stale');
  sock.send(JSON.stringify({ type: 'params', name: current, values: payload }));
}

function settled(name) {
  if (inflight !== name) return;
  inflight = null;
  if (pending !== null) flush();
  else document.body.classList.remove('stale');
}

// ---- part list ----
let project = '';

// The tab is the only part of this visible when the window is behind another one, and
// with a server per project there can be several. Part first: that is what changes.
function title() {
  document.title = [current, project].filter(Boolean).join(' \u00b7 ') || 'nurb';
}

// The server resolves this from the values it successfully built. Failed builds have
// no active variant, and non-slider parameters such as booleans still count.
function variantActive(e, v) {
  return e && e.variant === v.name;
}

function activeVariant(e) {
  return e && (e.variants || []).find(v => variantActive(e, v)) || null;
}

// Picking a variant is loading its overrides: the same pipeline a slider drag uses, so
// checks, export and the write button all just see the part flexed. Sent raw rather
// than through the sliders' setters, so the overrides land as one message instead of a
// push per parameter; sync() moves the sliders when the rebuild lands.
function applyVariant(name, v) {
  if (!sock || sock.readyState !== WebSocket.OPEN) return;
  pending = null; pendingFor = null;   // a drag in flight must not resurrect old values
  inflight = name;
  document.body.classList.add('stale');
  sock.send(JSON.stringify({ type: 'params', name, values: { ...v.params } }));
}

// The address bar always holds the link to what is on screen, so any part or variant
// can be handed to someone as a URL. Named views and bare renders own their URLs.
function setURL(vname) {
  if (bare || view) return;
  const u = new URL(location);
  if (current) u.searchParams.set('part', current); else u.searchParams.delete('part');
  const v = vname || (current && activeVariant(parts.get(current))?.name);
  if (v) u.searchParams.set('variant', v); else u.searchParams.delete('variant');
  if (u.href !== location.href) history.replaceState(null, '', u);
}

function render() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  // Here rather than on the sync message, so the first part written into an empty
  // project brings the tools back without a reload.
  document.body.classList.toggle('noparts', parts.size === 0);
  for (const e of parts.values()) {
    const row = document.createElement('div');
    row.className = 'item' + (e.name === current ? ' active' : '');
    row.innerHTML = `<span class="dot ${e.error ? 'bad' : ''}"></span>`
      + `<span class="name">${e.name}</span>`
      + `<span class="ms">${e.error ? 'err' : e.ms + 'ms'}</span>`;
    row.onclick = () => { current = e.name; render(); show(e.name, { keepCamera: false }); setURL(); };
    list.appendChild(row);
    for (const v of e.variants || []) {
      const vr = document.createElement('div');
      vr.className = 'item var' + (e.name === current && variantActive(e, v) ? ' active' : '');
      vr.innerHTML = `<span class="name">${v.name}</span>`;
      vr.title = Object.entries(v.params).map(([k, val]) => `${k} = ${val}`).join('\n');
      vr.onclick = () => {
        if (current !== e.name) { current = e.name; show(e.name, { keepCamera: false }); }
        applyVariant(e.name, v);
        render();
        setURL(v.name);
      };
      list.appendChild(vr);
    }
  }
  title();
}

function flash(name) {
  const rows = [...document.querySelectorAll('.item:not(.var)')];
  const row = rows.find(r => r.querySelector('.name').textContent === name);
  if (!row) return;
  const dot = row.querySelector('.dot');
  dot.classList.add('busy');
  setTimeout(() => dot.classList.remove('busy'), 400);
}

// ---- update check ----
// The server says what is installed; PyPI says what is newest, asked at most once a
// day (localStorage remembers) and never in a headless render. Offline, the fetch
// fails silently and the badge is just the installed version.
let installedVersion = null, latestVersion = null, upgradable = false;

function versionBadge(installed, latest) {
  const el = document.getElementById('version');
  if (!installed) return;
  installedVersion = installed;
  if (latest && newerVersion(installed, latest)) {
    latestVersion = latest;
    el.textContent = `v${installed} ↑`;
    el.title = `${latest} is out`;
    el.classList.add('update');
  } else {
    latestVersion = null;
    el.textContent = `v${installed}`;
    el.title = '';
    el.classList.remove('update');
    // A sync landing here with the modal open is the post-upgrade reconnect: the
    // restarted server is the new version, so the modal's work is done.
    upgradeModal(false);
  }
}

// ---- upgrade modal ----
function upgradeModal(open) {
  document.getElementById('upgrade').classList.toggle('open', open);
  if (!open) return;
  document.getElementById('upnew').textContent = `nurb ${latestVersion}`;
  document.getElementById('uphave').textContent = `v${installedVersion}`;
  const go = document.getElementById('upgo');
  // The server only offers the button when it knows how it was installed (a uv tool
  // venv); anyone else gets the command to run themselves.
  go.style.display = upgradable ? '' : 'none';
  go.disabled = false;
  go.textContent = 'upgrade and restart';
  const note = document.getElementById('upnote');
  note.classList.remove('bad');
  note.textContent = '';
}
document.getElementById('version').onclick = () => { if (latestVersion) upgradeModal(true); };
document.getElementById('upgrade').onclick = ev => { if (ev.target.id === 'upgrade') upgradeModal(false); };
addEventListener('keydown', ev => { if (ev.key === 'Escape') upgradeModal(false); });
document.getElementById('upgo').onclick = ev => {
  sock.send(JSON.stringify({ type: 'upgrade' }));
  ev.target.disabled = true;
  ev.target.textContent = 'upgrading…';
  document.getElementById('upnote').textContent = 'the viewer reconnects when the new server is up';
};

function newerVersion(a, b) {
  const pa = a.split('.').map(Number), pb = b.split('.').map(Number);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const d = (pb[i] || 0) - (pa[i] || 0);
    if (d) return d > 0;
  }
  return false;
}

async function checkUpdate(installed) {
  versionBadge(installed, null);
  if (bare) return;
  const cached = JSON.parse(localStorage.getItem('nurb-latest') || 'null');
  if (cached && Date.now() - cached.at < 86400e3) return versionBadge(installed, cached.version);
  try {
    const resp = await fetch('https://pypi.org/pypi/nurb/json');
    const latest = (await resp.json()).info.version;
    localStorage.setItem('nurb-latest', JSON.stringify({ at: Date.now(), version: latest }));
    versionBadge(installed, latest);
  } catch { /* offline; the badge already shows the installed version */ }
}

// ---- socket ----
function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  sock = ws;
  const conn = document.getElementById('conn');
  ws.onopen = () => conn.textContent = '';
  ws.onclose = () => {
    conn.textContent = 'reconnecting';
    // Nothing is coming back, so the in-flight rebuild has to be forgotten or the
    // sliders go dead for good.
    inflight = null;
    document.body.classList.remove('stale');
    setTimeout(connect, 1000);
  };
  ws.onmessage = ev => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'sync') {
      project = msg.project || '';
      document.getElementById('project').textContent = project;
      polished = !msg.draft;   // `nurb dev --draft` starts with the toggle off
      polishBadge();
      upgradable = !!msg.upgradable;
      checkUpdate(msg.version);
      parts.clear();
      msg.parts.forEach(p => parts.set(p.name, p));
      if (!current && parts.has(want)) current = want;
      if (!current && msg.parts.length) current = msg.parts[0].name;
      // ?variant= is an ask, so it loads that variant's overrides once. Once, because
      // a reconnect sync must not snap back what the user has since dragged away.
      let linked = null;
      if (wantVariant && current === want) {
        linked = (parts.get(current).variants || []).find(v => v.name === wantVariant);
        if (linked) applyVariant(current, linked);
      }
      wantVariant = null;
      render();
      if (current) show(current, { keepCamera: false });
      setURL(linked && linked.name);
    }
    if (msg.type === 'rebuilt') {
      parts.set(msg.name, msg);
      // The first part in an empty project arrives here, not in a sync, so without
      // this `nurb new` in a running `nurb dev` fills the list and leaves the canvas
      // showing "no parts yet".
      if (!current) current = msg.name;
      render();
      flash(msg.name);
      // Unconditionally, and by name: a rebuild the user walked away from still has to
      // release the slot it was holding.
      settled(msg.name);
      if (msg.name === current) { show(msg.name, { keepCamera: true }); setURL(); }
    }
    // Checks arrive after the geometry, so this only repaints the panel.
    // Deleted or renamed away. Without this it stays in the list, selectable, with
    // sliders that rebuild a file that is not there.
    if (msg.type === 'gone') {
      parts.delete(msg.name);
      if (current === msg.name) {
        current = parts.size ? parts.keys().next().value : null;
        if (current) show(current, { keepCamera: false });
        else { document.getElementById('empty').style.display = 'grid'; }
      }
      render();
      setURL();
    }
    if (msg.type === 'checked') {
      parts.set(msg.name, msg);
      if (msg.name === current) checks(msg.name);
    }
    // Success never arrives as a message: the server execs itself and the socket
    // drops, so only a failure has anything to say.
    if (msg.type === 'upgraded' && msg.error) {
      const go = document.getElementById('upgo');
      go.disabled = false;
      go.textContent = 'upgrade and restart';
      const note = document.getElementById('upnote');
      note.classList.add('bad');
      note.textContent = msg.error;
    }
    if (msg.type === 'applied' && msg.name === current) {
      lastNote = {
        name: msg.name,
        bad: !!msg.error,
        text: msg.error
          ? msg.error
          : [`wrote ${msg.written.join(', ') || 'nothing'}`,
             ...(msg.skipped || []).map(s => `left ${s.name} alone: ${s.why}`)].join('\n'),
      };
      const note = document.getElementById('note');
      if (note) { note.classList.toggle('bad', lastNote.bad); note.textContent = lastNote.text; }
    }
  };
}
connect();
</script>
</body>
</html>
