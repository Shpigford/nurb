name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked --all-extras --dev

      # `nurb render` is the one command that wants a browser, and the extra installs
      # playwright without one. Without this the render tests do not skip, they fail.
      - run: uv run playwright install --with-deps chromium

      # The suite is CPU-bound OCCT builds and parallelizes almost perfectly: -n auto
      # cut it 3x on a laptop and the runner has four cores.
      - run: uv run pytest -q -n auto

  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The grading tests guard the scorer, and the scorer only changes when its code
      # or the engine changes. Submission PRs, verdict edits (site.py is covered by
      # test_report), and leaderboard regenerations are data-only and get the cheap
      # validation tests instead of the full grading suite.
      - uses: dorny/paths-filter@v3
        id: changed
        with:
          filters: |
            scorer:
              - 'evals/tasks/**'
              - 'evals/tests/**'
              - 'evals/pyproject.toml'
              - 'evals/uv.lock'
              - 'src/nurb/**'
              - 'pyproject.toml'
              - 'uv.lock'

      # The src-minus-site.py test needs its own step: a negation pattern only
      # works under the `every` quantifier, and under the default `some` it
      # matches every file in the repo, which ran the full suite on every PR.
      # `every` in turn would break the plain list above, since no file can
      # match two different globs at once.
      - uses: dorny/paths-filter@v3
        id: scorer_src
        with:
          predicate-quantifier: every
          filters: |
            code:
              - 'evals/src/**'
              - '!evals/src/nurb_evals/site.py'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked --dev
        working-directory: evals

      # Every grade() builds parts in its own subprocess and temp dir, so the suite
      # parallelizes cleanly: 6:11 serial to 1:42 on four cores. loadscope keeps each
      # module's expensive module-scoped grades fixture on one worker instead of
      # rebuilding it per worker.
      - if: steps.changed.outputs.scorer == 'true' || steps.scorer_src.outputs.code == 'true'
        run: uv run pytest -q -n auto --dist loadscope
        working-directory: evals

      - if: steps.changed.outputs.scorer != 'true' && steps.scorer_src.outputs.code != 'true'
        run: uv run pytest -q tests/test_report.py tests/test_pricing.py tests/test_contribute.py
        working-directory: evals

  # The rules against the real library, on a machine that is not the one they were
  # calibrated on. --strict is what makes a finding fail the build; the command
  # reports and exits 0 without it, because a warning that blocks work gets switched
  # off. Run from the project directory, since a project is any directory with parts/.
  # A separate job because it needs no browser and its 13 serial builds would
  # otherwise sit behind pytest instead of running beside it.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked --dev

      - name: nurb check --strict
        working-directory: examples/notch
        run: uv run --project ../.. nurb check --strict
