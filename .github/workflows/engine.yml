name: engine

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "engine/**"
      - "packages/workbench/**"
      - ".github/workflows/engine.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    # The serve tests boot a fresh engine each and are half the suite's time, so they get
    # their own runner. Public repos run parallel jobs for free.
    strategy:
      matrix:
        shard:
          - tests/test_serve.py
          - tests --ignore=tests/test_serve.py
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked --all-extras --dev
        working-directory: engine

      # The `/` route test wants the real page, not the "not built" branch of it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build --workspace packages/workbench

      # The suite is CPU-bound OCCT builds and parallelizes almost perfectly: -n auto
      # cut it 3x on a laptop and the runner has four cores.
      - run: uv run pytest -q -n auto ${{ matrix.shard }}
        working-directory: engine
