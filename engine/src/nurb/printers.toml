# Shipped printer profiles: machine facts, not part judgements.
#
# A bed size belongs to the machine, so it lives here and is picked once per project
# in printer.toml, never per card. What a part has justified (its min_wall, its
# accepted slivers) stays on its card next to the sentence explaining why.
#
# Every key must be a field of checks.Context, with four exceptions. `slicer` is what
# this machine is called in a slicer's own vendor bundle, which slicing needs and no
# rule does, and `prusaslicer` is its printer preset in PrusaSlicer's, whose names
# follow no pattern code could derive. `label` is what a person calls it, and `brand`
# groups the picker. They live here so a machine is described in one place. Sizes are
# manufacturer-published build volumes in mm, X x Y x Z.

[bambu_x1c]
bed = [256.0, 256.0, 256.0]
slicer = "Bambu Lab X1 Carbon"
label = "Bambu Lab X1 Carbon"
brand = "Bambu Lab"

# Dual-nozzle like the H2 series: these are the single-material figures from
# Bambu Studio's machine profile (printable_area 256x256, printable_height 261).
# The auxiliary nozzle loses about 21mm of X and 5mm of Z.
[bambu_x2d]
bed = [256.0, 256.0, 261.0]
slicer = "Bambu Lab X2D"
label = "Bambu Lab X2D"
brand = "Bambu Lab"

[bambu_p1s]
bed = [256.0, 256.0, 256.0]
slicer = "Bambu Lab P1S"
label = "Bambu Lab P1S"
brand = "Bambu Lab"

[bambu_p2s]
bed = [256.0, 256.0, 256.0]
slicer = "Bambu Lab P2S"
label = "Bambu Lab P2S"
brand = "Bambu Lab"

[bambu_p1p]
bed = [256.0, 256.0, 256.0]
slicer = "Bambu Lab P1P"
label = "Bambu Lab P1P"
brand = "Bambu Lab"

[bambu_a1]
bed = [256.0, 256.0, 256.0]
slicer = "Bambu Lab A1"
label = "Bambu Lab A1"
brand = "Bambu Lab"

[bambu_a1_mini]
bed = [180.0, 180.0, 180.0]
slicer = "Bambu Lab A1 mini"
label = "Bambu Lab A1 mini"
brand = "Bambu Lab"

# The H2 series carries a caveat no single number holds: a dual-nozzle job loses X,
# because both nozzles have to reach every point. These are the single-material
# figures, which is what a one-piece printed part is, taken from the slicer's own
# machine profile rather than the spec sheet so they agree with what will actually
# slice. Subtract 50mm of X before trusting one for a two-material plate.
[bambu_h2c]
bed = [330.0, 320.0, 325.0]
slicer = "Bambu Lab H2C"
label = "Bambu Lab H2C"
brand = "Bambu Lab"

[bambu_h2d]
bed = [350.0, 320.0, 325.0]
slicer = "Bambu Lab H2D"
label = "Bambu Lab H2D"
brand = "Bambu Lab"

[bambu_h2s]
bed = [340.0, 320.0, 340.0]
slicer = "Bambu Lab H2S"
label = "Bambu Lab H2S"
brand = "Bambu Lab"

[prusa_mk4s]
bed = [250.0, 210.0, 220.0]
slicer = "Prusa MK4S"
prusaslicer = "Original Prusa MK4S 0.4 nozzle"
label = "Prusa MK4S"
brand = "Prusa"

[prusa_mini]
bed = [180.0, 180.0, 180.0]
slicer = "Prusa MINI"
prusaslicer = "Original Prusa MINI & MINI+ Input Shaper"
label = "Prusa MINI"
brand = "Prusa"

[prusa_xl]
bed = [360.0, 360.0, 360.0]
slicer = "Prusa XL"
prusaslicer = "Original Prusa XL Input Shaper 0.4 nozzle"
label = "Prusa XL"
brand = "Prusa"

[ender_3_v3]
