slicer = "Creality K2 Plus"
label = "Creality K2 Plus"
brand = "Creality"

[anycubic_kobra_2]
bed = [220.0, 220.0, 250.0]
slicer = "Anycubic Kobra 2"
label = "Anycubic Kobra 2"
brand = "Anycubic"
